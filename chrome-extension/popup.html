<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=380">
  <link rel="stylesheet" href="popup.css">
  <title>Wantry</title>
</head>
<body>
  <!-- Loading State -->
  <div id="state-loading" class="state">
    <div class="header">
      <img src="icons/icon-32.png" alt="Wantry" class="header-icon">
      <span class="header-title">Add to Wantry</span>
    </div>
    <div class="loading-body">
      <div class="spinner"></div>
      <p class="loading-text">Extracting product details...</p>
    </div>
  </div>

  <!-- Not Logged In State -->
  <div id="state-login" class="state" style="display: none;">
    <div class="header">
      <img src="icons/icon-32.png" alt="Wantry" class="header-icon">
      <span class="header-title">Add to Wantry</span>
    </div>
    <div class="login-body">
      <div class="login-icon">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#B8386B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>
      <p class="login-title">Not logged in</p>
      <p class="login-desc">Sign in to Wantry to start saving items to your wishlist.</p>
      <button id="btn-open-wantry" class="btn-primary">Open Wantry</button>
    </div>
  </div>

  <!-- Form State -->
  <div id="state-form" class="state" style="display: none;">
    <div class="header">
      <img src="icons/icon-32.png" alt="Wantry" class="header-icon">
      <span class="header-title">Add to Wantry</span>
      <div id="ai-badge" class="ai-badge" style="display: none;">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.09 6.26L20.18 9l-4.64 4.14L16.54 20 12 16.27 7.46 20l1-6.86L3.82 9l6.09-.74z"/></svg>
        AI Enhanced
      </div>
    </div>

    <!-- Product Preview -->
    <div class="product-preview">
      <div id="product-image-wrap" class="product-image-wrap">
        <img id="product-image" src="" alt="" class="product-image">
        <div id="product-image-placeholder" class="product-image-placeholder">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <path d="m21 15-5-5L5 21"/>
          </svg>
        </div>
      </div>
      <div class="product-info">
        <p id="product-name-preview" class="product-name-preview"></p>
        <p id="product-price-preview" class="product-price-preview"></p>
        <p id="product-store-preview" class="product-store-preview"></p>
      </div>
    </div>

    <!-- Editable Fields -->
    <div class="form-fields">
      <div class="field">
        <label for="input-name">Product Name</label>
        <input type="text" id="input-name" placeholder="Product name" required>
      </div>

      <div class="field-row">
        <div class="field flex-1">
          <label for="input-price">Price</label>
          <input type="number" id="input-price" step="0.01" placeholder="0.00">
        </div>
        <div class="field" style="width: 80px;">
          <label for="input-currency">Currency</label>
          <input type="text" id="input-currency" placeholder="USD" maxlength="3">
        </div>
        <div class="field flex-1">
          <label for="input-store">Store</label>
          <input type="text" id="input-store" placeholder="Store name">
        </div>
      </div>

      <div class="field">
        <label for="input-notes">Notes</label>
        <textarea id="input-notes" rows="2" placeholder="Product description..."></textarea>
      </div>

      <!-- Tags -->
      <div id="tags-section" class="field" style="display: none;">
        <label>Tags</label>
        <div id="tags-container" class="tags-container"></div>
      </div>
    </div>

    <!-- Actions -->
    <div class="actions">
      <button id="btn-save" class="btn-primary">
        <span id="btn-save-text">Save to Wishlist</span>
        <div id="btn-save-spinner" class="spinner-small" style="display: none;"></div>
      </button>
    </div>
  </div>

  <!-- Success State -->
  <div id="state-success" class="state" style="display: none;">
    <div class="header">
      <img src="icons/icon-32.png" alt="Wantry" class="header-icon">
      <span class="header-title">Add to Wantry</span>
    </div>
    <div class="success-body">
      <div class="success-icon">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
          <polyline points="22 4 12 14.01 9 11.01"/>
        </svg>
      </div>
      <p class="success-title">Added to Wishlist!</p>
      <p class="success-desc">The item has been saved.</p>
    </div>
  </div>

  <!-- Error State -->
  <div id="state-error" class="state" style="display: none;">
    <div class="header">
      <img src="icons/icon-32.png" alt="Wantry" class="header-icon">
      <span class="header-title">Add to Wantry</span>
    </div>
    <div class="error-body">
      <p class="error-title">Something went wrong</p>
      <p id="error-message" class="error-desc"></p>
      <button id="btn-retry" class="btn-outline">Try Again</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
